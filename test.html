<div class="stage"></div>

<style>
  :root {
    --dauer: 8s;
    --kurve: ease-in-out;

    /* Farbtöne (kannst du nach Geschmack tweaken) */
    --hell: #7ea0c9; /* helles Blau links */
    --blau: #1e55a2; /* sattes Blau */
    --dunkel: #0c1520; /* fast schwarz/blaugrau */
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000; /* Fallback */
  }

  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: cover;
    /* weiches Crossfade */
    animation: none;
  }

  /* „Bild 1“ – hell links, kräftiges Blau mittig/rechts, dunkler Rand rechts */
  .stage::before {
    /* mehrere Layer für Tiefe */
    background: radial-gradient(120% 85% at 78% 8%, var(--blau) 0%, #143a73 55%, var(--dunkel) 100%), radial-gradient(120% 120% at 0% 50%, var(--hell) 0%, rgba(126, 160, 201, 0) 60%), linear-gradient(110deg, #14263d 0%, rgba(20, 38, 61, 0) 55%);
    animation: fadeA var(--dauer) var(--kurve) infinite;
  }

  /* „Bild 2“ – dunklere Vignette links, Blau mittig, hellere rechte Seite */
  .stage::after {
    background: radial-gradient(140% 110% at 10% 10%, #2a3442 0%, #1b2330 45%, rgba(27, 35, 48, 0) 70%), radial-gradient(120% 90% at 65% 40%, #1c4f9a 0%, #244f8a 55%, rgba(28, 79, 154, 0) 80%), radial-gradient(120% 110% at 100% 50%, rgba(126, 160, 201, 0.9) 0%, rgba(126, 160, 201, 0) 55%), linear-gradient(100deg, #0b1523 0%, rgba(11, 21, 35, 0) 60%);
    animation: fadeB var(--dauer) var(--kurve) infinite;
  }

  /* Crossfade-Keyframes */
  @keyframes fadeA {
    0%
  {
      opacity: 1;
    }
    50% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }

  }
  @keyframes fadeB {
    0% {
      opacity: 0;
    }
    50%{
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  /* Weniger Bewegung respektieren */
  @media (prefers-reduced-motion: reduce) {
    .stage::before,
    .stage::after {
      animation: none;
    }
    .stage::before {
      opacity: 1;
    }
    .stage::after {
      opacity: 0;
    }
  }
</style>
