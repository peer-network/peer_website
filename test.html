<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animierter Multi-Gradient Hintergrund (Canvas)</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background:#0b1020; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display:block; }
  .content {
    position: relative; z-index: 1;
    min-height: 100%; display:grid; place-items:center; color:#e6e6f0;
    font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
    text-align: center;
  }
  .card {
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    background: #ffffff0f; border: 1px solid #ffffff1a; border-radius: 16px;
    padding: 24px 28px; max-width: 60ch; box-shadow: 0 10px 40px #00000066;
  }
  .hint { opacity:.8; font-size:.9rem }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="content">
  <div class="card">
    <h1>Animierter Canvas-Gradient</h1>
    <p class="hint">Bewege die Maus für einen subtilen Parallax-Effekt ✨</p>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d', { alpha: true });

  // ------- Konfiguration -------
  const CFG = {
    speed: 0.2,          // Basisspeed der Animation
    blobs: 6,             // Anzahl radialer Blobs
    baseAlpha: 0.1,      // Grunddeckkraft der Blobs
    pulseAmount: 0.32,    // Stärke der Pulsation (0..1)
    vignette: 0.86,       // 0..1 (Stärke der Randabdunklung)
    linearDrift: 0.2,    // Speed der linearen Tints
    colors: [             // Primärfarben der Blobs
      '#0ea5e9', // cyan
      '#a78bfa', // violet
      '#f472b6', // pink
      '#22c55e', // green
      '#f59e0b', // amber      '#a78bfa', // violet
      '#f472b6', // pink
      '#22c55e', // green
      '#f59e0b', // amber
      '#60a5fa'  // light blue
    ]
  };

  // Maus-Parallax
  const mouse = { x: 0.5, y: 0.5 };
  addEventListener('mousemove', e => {
    mouse.x = e.clientX / innerWidth;
    mouse.y = e.clientY / innerHeight;
  }, { passive: true });

  // DPI / Resize
  let dpr = 1;
  function resize() {
    dpr = Math.max(1, devicePixelRatio || 1);
    canvas.width  = Math.floor(innerWidth  * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width  = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize, { passive: true });
  resize();

  // ------- Hilfsfunktionen -------
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  // Blob-Parameter generieren (Orbit + Radius + Farbe)
  const blobs = Array.from({ length: CFG.blobs }).map((_, i) => {
    const col = CFG.colors[i % CFG.colors.length];
    return {
      color: col,
      // Orbit-Ellipse in Prozent (0..1 relativ zur Leinwand)
      ox: rand(0.2, 0.8),
      oy: rand(0.2, 0.8),
      rx: rand(0.18, 0.42),      // horizontale Orbit-Radius-Rel.
      ry: rand(0.12, 0.35),      // vertikale Orbit-Radius-Rel.
      phase: rand(0, TAU),       // Startphase
      omega: rand(0.15, 0.6),    // individuelle Geschwindigkeit
      // Farben/Alpha
      a: CFG.baseAlpha * rand(0.8, 1.4),
      // Größe relativ zur kurzen Kante
      size: rand(0.25, 0.45),
      // Pulsation
      pulse: rand(0.6, 1.4)
    };
  });

  function fillLinear(t, dir = 1) {
    // Zwei großflächige lineare Gradients mit langsamem Drift
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    // Drift-Offsets (0..1)
    const o1 = (t * CFG.linearDrift) % 1;
    const o2 = ((t * CFG.linearDrift) * 0.6) % 1;

    // Gradient 1
    let g1 = ctx.createLinearGradient(0, 0, w, h);
    g1.addColorStop(0,  hexA('#0ea5e9', 0.13));
    g1.addColorStop(lerp(0.25, 0.75, o1), hexA('#a78bfa', 0.10));
    g1.addColorStop(1,  'transparent');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, w, h);

    // Gradient 2
    let g2 = ctx.createLinearGradient(w, 0, 0, h);
    g2.addColorStop(0,  hexA('#f59e0b', 0.10));
    g2.addColorStop(lerp(0.2, 0.8, o2), 'transparent');
    g2.addColorStop(1,  hexA('#60a5fa', 0.06));
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, w, h);
  }

  function hexA(hex, alpha) {
    // akzeptiert #rrggbb oder #rgb
    const c = hex.replace('#','');
    const m = c.length === 3
      ? c.split('').map(s => s + s).join('')
      : c;
    const r = parseInt(m.slice(0,2),16);
    const g = parseInt(m.slice(2,4),16);
    const b = parseInt(m.slice(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function drawVignette() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const cx = w/2, cy = h/2;
    const inner = Math.min(w, h) * 0.3;
    const outer = Math.max(w, h) * 0.85;

    const vg = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${CFG.vignette})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);
  }

  // ------- Animation -------
  let start = performance.now();
  function frame(now) {
    const t = (now - start) / 1000;              // Sekunden
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const short = Math.min(w, h);

    ctx.clearRect(0, 0, w, h);

    // Hintergrund-Tints
    fillLinear(t);

    // Additive Glows für die Radials
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (const b of blobs) {
      const tt = t * CFG.speed * b.omega + b.phase;

      // Orbit + leichte Maus-Parallaxe
      const px = (b.ox + Math.cos(tt) * b.rx * lerp(0.9, 1.1, mouse.x)) * w;
      const py = (b.oy + Math.sin(tt) * b.ry * lerp(0.9, 1.1, mouse.y)) * h;

      // Pulsation der Größe
      const pulse = 1 + Math.sin(tt * b.pulse) * CFG.pulseAmount;
      const rOuter = short * b.size * pulse;

      // Radialer Gradient
      const g = ctx.createRadialGradient(px, py, 0, px, py, rOuter);
      g.addColorStop(0.00, hexA(b.color, Math.min(1, b.a * 4)));
      g.addColorStop(0.55, hexA(b.color, b.a));
      g.addColorStop(1.00, 'rgba(0,0,0,0)');

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, rOuter, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // sanfte Vignette oben drauf
    drawVignette();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
